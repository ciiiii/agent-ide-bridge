name: release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Uses release-please-config.json + .release-please-manifest.json (manifest mode)
      # so extra-files (herdr-plugin.toml, protocol.ts SERVER_INFO) are version-bumped too.
      - uses: googleapis/release-please-action@v4
        id: rp

  attach-vsix:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package # builds dist/ (extension + cli) and the .vsix
      # Ship both frontends: the code-server extension (.vsix) and the standalone
      # terminal CLI bundle (dist/cli.js) as `claude-diff`.
      - run: cp dist/cli.js claude-diff
      - run: gh release upload "${{ needs.release-please.outputs.tag_name }}" agent-ide-bridge.vsix claude-diff --clobber
        env:
          GITHUB_TOKEN: ${{ github.token }}
